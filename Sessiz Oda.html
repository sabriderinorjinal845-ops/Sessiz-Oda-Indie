<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sessiz Oda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Düzen: üstte ince çubuk, ortada 4:3 oyun tuvali, mobil modda altta dokunmatik kontroller.
   Oyun tek bir karanlık dünyada geçtiği için tek temalı; renkler yine de belirteçlerden gelir. */
:root{
  --bg:#030304; --ink:#efe9de; --blood:#c8102e; --dim:#8a8590; --panel:#0b0a0f; --gold:#ffd23f;
  --line:#2a2830;
  --font:'VT323','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.brand{font-size:28px;letter-spacing:.22em;color:var(--dim)}
.brand b{color:var(--blood);font-weight:400}
.right{display:flex;align-items:center;gap:12px}
#modeTag{font-size:20px;color:var(--dim);letter-spacing:.12em}
.iconbtn{width:44px;height:44px;border:2px solid var(--ink);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.iconbtn:hover,.iconbtn:focus-visible{background:var(--ink);color:#000;outline:none}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
body.portrait.mobile #stage{align-items:flex-start;padding-top:6px}
canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--line);touch-action:none}

#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;z-index:5}
#pad[hidden]{display:none}
#dpad{position:relative;width:156px;height:156px;border-radius:50%;border:3px solid rgba(239,233,222,.55);background:rgba(11,10,15,.6);pointer-events:auto;touch-action:none}
#dpad i{position:absolute;color:rgba(239,233,222,.6);font-style:normal;font-size:24px;line-height:1}
#dpad .u{left:50%;top:9px;transform:translateX(-50%)}
#dpad .d{left:50%;bottom:9px;transform:translateX(-50%)}

#knob{position:absolute;width:56px;height:56px;border-radius:50%;left:50%;top:50%;margin:-28px 0 0 -28px;background:rgba(239,233,222,.25);border:2px solid rgba(239,233,222,.7);pointer-events:none}
#acts{display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.abtn{width:78px;height:78px;border-radius:50%;border:3px solid rgba(239,233,222,.7);background:rgba(11,10,15,.62);color:var(--ink);font:inherit;font-size:36px;cursor:pointer;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;padding:0}
.abtn small{font-size:16px;letter-spacing:.08em;color:var(--dim)}
.abtn.on{background:var(--ink);color:#000}
.abtn.on small{color:#333}
#bX{margin-bottom:38px}

.veil{position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;z-index:20;padding:16px}
.veil[hidden]{display:none}
.card{width:min(470px,100%);max-height:100%;overflow:auto;background:var(--panel);border:4px solid var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:14px;font-size:24px;-webkit-user-select:none;user-select:none}
.card h2{margin:0;font-weight:400;font-size:36px;letter-spacing:.2em}

.opt:hover,.opt:focus-visible{outline:none;border-color:var(--gold)}

.opt[aria-pressed="true"]::before{content:"\2665  ";color:var(--blood)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:22px;border-top:2px solid var(--line);padding-top:12px}
.legend dt{color:var(--gold)}
.legend dd{margin:0;color:var(--ink)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .opt{flex:1;text-align:center;min-width:130px}
#nameInput{font:inherit;font-size:40px;letter-spacing:.2em;text-transform:uppercase;text-align:center;background:#000;color:var(--ink);border:3px solid var(--ink);padding:8px;width:100%;
  -webkit-user-select:text;user-select:text;border-radius:0}
#nameInput:focus{outline:none;border-color:var(--gold)}
@media (max-width:480px){.brand{font-size:22px;letter-spacing:.12em}#modeTag{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<div id="app">
  <header id="bar">
    <div class="brand">SESSİZ <b>ODA</b></div>
    <div class="right">
      <span id="modeTag">PC</span>
      <button class="iconbtn" id="btnGear" type="button" aria-label="Ayarlar" title="Ayarlar">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
        </svg>
      </button>
    </div>

  <main id="stage"><canvas id="cv" width="640" height="480" aria-label="Oyun ekranı"></canvas></main>
</div>

<div id="pad" hidden>
  <div id="dpad"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><div id="knob"></div></div>

</div>

<div id="settings" class="veil" hidden>

<div id="nameui" class="veil" hidden>
  <form class="card" id="nameForm" autocomplete="off">
    <h2>ADIN NE?</h2>

    <input id="nameInput" maxlength="8" spellcheck="false" autocomplete="off" autocapitalize="characters" aria-label="Adın">
    <button class="opt" type="submit" style="text-align:center">TAMAM</button>
  </form>
</div>

<script>
'use strict';
/* ============ ÇEKİRDEK: yardımcılar, ayarlar, girdi, ses, metin, diyalog ============ */
const W = 640, H = 480;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const store = {
  get(k, d) { try { const v = localStorage.getItem('so_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('so_' + k, JSON.stringify(v)); } catch (e) {} }
};

const cfg = { mode: store.get('mode', null), sound: store.get('sound', true) };
if (cfg.mode !== 'pc' && cfg.mode !== 'mobile') {
  cfg.mode = (window.matchMedia && matchMedia('(pointer:coarse)').matches) ? 'mobile' : 'pc';
}
const G = { scene: 'title', name: store.get('name', 'MİSAFİR'), t: 0, paused: false };

/* ---------- Ayarlar paneli ---------- */
const LEGENDS = {
  pc: [['← ↑ ↓ → / WASD', 'Hareket'], ['Z / Enter / Boşluk', 'Onay, konuş'], ['X / Shift / Esc', 'İptal, yazıyı hızlandır, basılı tut: koş']],
  mobile: [['Sol daire', 'Hareket (8 yön)'], ['Z düğmesi', 'Onay, konuş'], ['X düğmesi', 'İptal, yazıyı hızlandır, basılı tut: koş'], ['Ekrana dokun', 'Başlık ekranında başlat']]
};
function settingsOpen() { return !$('settings').hidden; }
function typing() { return settingsOpen() || !$('nameui').hidden; }
function applyMode() {
  $('pad').hidden = cfg.mode !== 'mobile';
  document.body.classList.toggle('mobile', cfg.mode === 'mobile');
  $('optPc').setAttribute('aria-pressed', cfg.mode === 'pc');
  $('optMobile').setAttribute('aria-pressed', cfg.mode === 'mobile');
  $('modeTag').textContent = cfg.mode === 'pc' ? 'PC' : 'MOBİL';
  $('legend').innerHTML = LEGENDS[cfg.mode].map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  resize();
}
function setMode(m) { cfg.mode = m; store.set('mode', m); applyMode(); }
function openSettings() { $('settings').hidden = false; G.paused = true; resetHeld(); $('optClose').focus(); }
function closeSettings() { $('settings').hidden = true; G.paused = false; resetHeld(); if (document.activeElement) document.activeElement.blur(); }
function syncSoundBtn() { const b = $('optSound'); b.setAttribute('aria-pressed', cfg.sound); b.textContent = cfg.sound ? 'SES AÇIK' : 'SES KAPALI'; }
$('btnGear').addEventListener('click', () => { initAudio(); settingsOpen() ? closeSettings() : openSettings(); });
$('optClose').addEventListener('click', closeSettings);
$('optPc').addEventListener('click', () => setMode('pc'));
$('optMobile').addEventListener('click', () => setMode('mobile'));
$('optSound').addEventListener('click', () => { initAudio(); setSound(!cfg.sound); syncSoundBtn(); });
$('optTitle').addEventListener('click', () => { closeSettings(); if (typeof toTitle === 'function') toTitle(); });
$('settings').addEventListener('pointerdown', e => { if (e.target === $('settings')) closeSettings(); });

function resize() {
  const portrait = innerHeight > innerWidth;
  document.body.classList.toggle('portrait', portrait);
  const bar = 52, mob = cfg.mode === 'mobile';
  const reserve = (mob && portrait) ? 200 : 0;
  const availW = innerWidth - 32 - 4;
  const availH = innerHeight - bar - reserve - 8;
  let w = Math.min(availW, availH * 4 / 3);
  w = Math.max(200, Math.floor(w));
  cv.style.width = w + 'px';
  cv.style.height = Math.round(w * 3 / 4) + 'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- Girdi ---------- */
const held = { up: 0, down: 0, left: 0, right: 0, ok: 0, cancel: 0 };
let pq = [];
function resetHeld() { for (const k in held) held[k] = 0; $('knob').style.transform = ''; $('bZ').classList.remove('on'); $('bX').classList.remove('on'); }
function press(a) { pq.push(a); initAudio(); }
function setDir(d, on) { if (on && !held[d]) pq.push(d); held[d] = on ? 1 : 0; }
const KM = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const OKK = ['KeyZ', 'Enter', 'Space'], CANK = ['KeyX', 'ShiftLeft', 'ShiftRight', 'Escape'];
addEventListener('keydown', e => {
  if (settingsOpen()) { if (e.code === 'Escape') closeSettings(); return; }
  if (typing()) return;
  const d = KM[e.code];
  if (d) { if (!e.repeat) { setDir(d, 1); initAudio(); } e.preventDefault(); return; }
  if (OKK.includes(e.code)) { if (!e.repeat) press('ok'); held.ok = 1; e.preventDefault(); }
  else if (CANK.includes(e.code)) { if (!e.repeat) press('cancel'); held.cancel = 1; e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (typing()) return;
  const d = KM[e.code];
  if (d) { held[d] = 0; e.preventDefault(); return; }
  if (OKK.includes(e.code)) { held.ok = 0; e.preventDefault(); }
  else if (CANK.includes(e.code)) { held.cancel = 0; e.preventDefault(); }
});
addEventListener('blur', resetHeld);
document.addEventListener('visibilitychange', resetHeld);

const dpad = $('dpad'); let dpId = null;
function dpUpdate(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), lim = r.width * 0.26, kk = m > lim ? lim / m : 1;
  $('knob').style.transform = `translate(${dx * kk}px,${dy * kk}px)`;
  if (m < r.width * 0.11) { ['up', 'down', 'left', 'right'].forEach(d => setDir(d, 0)); return; }
  const ax = Math.abs(dx), ay = Math.abs(dy);
  setDir('left', dx < 0 && ax > ay * 0.42);
  setDir('right', dx > 0 && ax > ay * 0.42);
  setDir('up', dy < 0 && ay > ax * 0.42);
  setDir('down', dy > 0 && ay > ax * 0.42);
}
function dpEnd() { dpId = null; ['up', 'down', 'left', 'right'].forEach(d => setDir(d, 0)); $('knob').style.transform = ''; }
dpad.addEventListener('pointerdown', e => { dpId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (x) {} initAudio(); dpUpdate(e); e.preventDefault(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpId) dpUpdate(e); });
dpad.addEventListener('pointerup', e => { if (e.pointerId === dpId) dpEnd(); });
dpad.addEventListener('pointercancel', e => { if (e.pointerId === dpId) dpEnd(); });
function bindBtn(id, act) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { b.classList.add('on'); held[act] = 1; press(act); try { b.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
  const up = () => { b.classList.remove('on'); held[act] = 0; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
}
bindBtn('bZ', 'ok'); bindBtn('bX', 'cancel');
cv.addEventListener('pointerdown', () => { initAudio(); if (['title', 'ending', 'gameover'].includes(G.scene)) press('ok'); });

/* ---------- Ses (WebAudio ile üretilen) ---------- */
let AC = null, master = null, drone = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = cfg.sound ? 0.8 : 0; master.connect(AC.destination);
    startDrone();
  } catch (e) { AC = null; }
}
function setSound(on) { cfg.sound = on; store.set('sound', on); if (master) master.gain.setTargetAtTime(on ? 0.8 : 0, AC.currentTime, 0.05); }
function tone(f, d, type, v, slide, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
  g.gain.setValueAtTime(v || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v, fq, delay) {
  if (!AC) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = fq || 1000; f.Q.value = 0.8;
  g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.03);
}
const sfx = {
  blip(v) {
    if (v === 'w') noise(0.05, 0.05, rnd(1500, 3000));
    else if (v === 'c') tone(rnd(620, 760), 0.06, 'square', 0.045);
    else if (v === 'g') tone(rnd(180, 230), 0.07, 'triangle', 0.08);
    else tone(rnd(300, 340), 0.05, 'square', 0.04);
  },
  move() { tone(520, 0.05, 'square', 0.03); },
  ok() { tone(880, 0.08, 'square', 0.05); tone(1320, 0.1, 'square', 0.04, 0, 0.06); },
  step(v) { noise(0.07, v || 0.05, 260); },
  hit() { tone(180, 0.25, 'sawtooth', 0.12, 50); noise(0.18, 0.12, 700); },
  slash() { noise(0.25, 0.14, 2500); tone(900, 0.2, 'sawtooth', 0.07, 200); },
  heal() { tone(660, 0.1, 'triangle', 0.07); tone(880, 0.12, 'triangle', 0.07, 0, 0.09); tone(1100, 0.16, 'triangle', 0.07, 0, 0.18); },
  whisper() { noise(0.9, 0.08, 1800); noise(0.7, 0.06, 3200, 0.2); },
  jump() { tone(70, 0.6, 'sawtooth', 0.18, 40); noise(0.5, 0.25, 500); tone(1200, 0.3, 'square', 0.05, 3000); },
  glitch() { for (let i = 0; i < 4; i++) { noise(0.06, 0.1, rnd(300, 4000), i * 0.05); tone(rnd(100, 900), 0.05, 'square', 0.04, 0, i * 0.05); } },
  door() { noise(0.3, 0.12, 300); tone(90, 0.35, 'sawtooth', 0.08, 55); },
  heart() { tone(70, 0.12, 'sine', 0.25, 45); tone(60, 0.14, 'sine', 0.2, 40, 0.17); },
  shatter() { for (let i = 0; i < 6; i++) tone(rnd(400, 1800), 0.2, 'triangle', 0.05, rnd(80, 300), i * 0.03); noise(0.4, 0.15, 1500); },
  music() { [659, 587, 523, 587, 659, 659, 659, 587, 587, 587, 659, 784, 784].forEach((f, i) => { tone(f, 0.28, 'sine', 0.07, f * 0.985, i * 0.3); tone(f * 2, 0.2, 'triangle', 0.02, 0, i * 0.3); }); },
  warn() { tone(300, 0.12, 'square', 0.04); tone(300, 0.12, 'square', 0.04, 0, 0.16); }
};
function startDrone() {
  const g = AC.createGain(), lp = AC.createBiquadFilter();
  g.gain.value = 0.05; lp.type = 'lowpass'; lp.frequency.value = 180;
  [55, 55.4, 82.5].forEach((f, i) => { const o = AC.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = f; o.connect(lp); o.start(); });
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.13; lg.gain.value = 90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(g); g.connect(master); drone = { g, lp };
}
function setTension(t) { if (!drone) return; drone.g.gain.setTargetAtTime(0.03 + t * 0.07, AC.currentTime, 0.5); drone.lp.frequency.setTargetAtTime(150 + t * 350, AC.currentTime, 0.5); }

/* ---------- Çizim yardımcıları ---------- */
const FONT = s => `${s}px VT323,"Courier New",monospace`;
function txt(s, x, y, o) {
  o = o || {}; ctx.font = FONT(o.size || 32); ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = o.color || '#fff';
  if (o.shake) { x += rnd(-1.5, 1.5); y += rnd(-1.5, 1.5); }
  ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = FONT(size || 32); const out = [];
  s.split('\n').forEach(par => {
    let line = '';
    par.split(' ').forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
    out.push(line);
  });
  return out;
}
function box(x, y, w, h, c) { ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = c || '#fff'; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y + 2, w - 4, h - 4); }
const HEART = ['.XX..XX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'];
function drawHeart(x, y, s, c) {
  ctx.fillStyle = c || '#ff1f3d';
  for (let j = 0; j < 7; j++) for (let i = 0; i < 8; i++) if (HEART[j][i] === 'X') ctx.fillRect(Math.round(x - 4 * s + i * s), Math.round(y - 3.5 * s + j * s), s, s);
}

/* ---------- Ekran efektleri ---------- */

}
function endDodge() { BS.turn++; BS.bullets = []; toMenu(); }
function updBattle(dt, acts) {

  neutral: { title: 'NÖTR SON', sub: 'YANKI', lines: () => ['* Gölge Çocuk gitti. Ama ev uyanık kaldı.', cl('Canımı yaktın...^ ama yine de kaldın.'), '* Kapı açıldı. Dışarıda yağmur hâlâ yağıyor.', { t: '* Arkandan bir fısıltı:', v: 'w' }, { t: 'bir daha gel.', v: 'c', color: '#ff8090', shake: true }] },
  bad: { title: 'KÖTÜ SON', sub: 'BOŞLUK', lines: () => ['* Gölge Çocuk toza dönüştü.', '* Işıklar tek tek sönüyor.', { t: `* Ev seni sevecek, ${G.name}.`, color: '#ff3050', fx: 'glitch' }, { t: '* Merdiven yok. Kapı yok. Sadece bir sandalye var.', fx: 'shake' }, { t: '* Ve seni bekleyen biri.', v: 'w', color: '#ff3050' }] }
};
function afterChild(res) {
  S.childDone = true;
  startEnding(res === 'killed' ? 'bad' : (S.attacked || S.killedGhost) ? 'neutral' : 'good');
}
function startEnding(type) {
  G.scene = 'ending'; END.type = type; END.phase = 'text'; END.t = 0; setTension(type === 'good' ? 0 : 0.8);
  const seen = store.get('endings', {}); seen[type] = 1; store.set('endings', seen);
  if (type === 'bad') store.set('haunt', true);
  say(ENDINGS[type].lines().map(l => typeof l === 'string' ? { t: l, nopre: false } : l), () => { END.phase = 'card'; END.t = 0; if (type === 'bad') { fx.glitch = 1; sfx.jump(); } });
}
function drawEndingBG() {
  const t = END.t + G.t * 0, ty = END.type;
  if (ty === 'good') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b2a4a'); g.addColorStop(0.6, '#e9915a'); g.addColorStop(1, '#ffd9a0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (ty === 'neutral') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#15181d'); g.addColorStop(1, '#4a525c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(180,200,220,.25)'; ctx.lineWidth = 1; for (let i = 0; i < 60; i++) { const x = (i * 53 + G.t * 90) % W, y = (i * 97 + G.t * 380) % H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 14); ctx.stroke(); }
  } else { ctx.fillStyle = '#050102'; ctx.fillRect(0, 0, W, H); }
  if (ty !== 'bad') {
    ctx.fillStyle = '#0a0a0e'; ctx.fillRect(0, 380, W, 100); ctx.fillRect(210, 230, 220, 160); ctx.beginPath(); ctx.moveTo(190, 232); ctx.lineTo(320, 150); ctx.lineTo(450, 232); ctx.fill();
    ctx.fillStyle = ty === 'good' ? '#ffd23f' : '#2a2f38'; ctx.fillRect(240, 280, 30, 36); ctx.fillRect(370, 280, 30, 36); ctx.fillStyle = '#000'; ctx.fillRect(298, 320, 44, 70);
    if (ty === 'good') { for (let i = 0; i < 18; i++) { const a = ((G.t * 0.25 + i / 18) % 1); ctx.fillStyle = `rgba(255,255,255,${1 - a})`; ctx.fillRect(320 + Math.sin(i * 2.1) * 40, 330 - a * 260, 4, 4); } }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(250, 292, 4, 4); ctx.fillRect(259, 292, 4, 4); }
  } else {
    const a = 0.55 + 0.45 * Math.sin(G.t * 2); ctx.fillStyle = `rgba(255,20,50,${a})`;
    ctx.beginPath(); ctx.ellipse(250, 200, 26, 16, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(390, 200, 26, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(244, 190, 8, 20); ctx.fillRect(384, 190, 8, 20);
    drawKid(320, 420, 'up', 0, false); if (Math.random() < 0.03) fx.glitch = 0.15;
  }
}
function toTitle() {
  G.scene = 'title'; dlg.active = false; dlg.queue = []; later_.length = 0; G.busy = false; BS.bullets = [];
  fx.fade = 0; fx.fadeT = 0; fx.fadeCb = null; fx.red = 0; fx.glitch = 0; fx.shake = 0; setTension(0.1); $('nameui').hidden = true; G.paused = settingsOpen();
}
const eyesBg = []; let eyeT = 1;
function drawTitle() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  eyeT -= 1 / 60; if (eyeT < 0) { eyeT = rnd(1.2, 3); eyesBg.push({ x: rnd(40, 600), y: rnd(250, 450), t: 0 }); if (eyesBg.length > 3) eyesBg.shift(); }
  eyesBg.forEach(e => { e.t += 1 / 60; const a = Math.sin(Math.min(1, e.t / 2.4) * Math.PI); if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`; ctx.fillRect(e.x, e.y, 6, 9); ctx.fillRect(e.x + 16, e.y, 6, 9); } });
  const fl = Math.random() < 0.04, gx = fl ? rnd(-6, 6) : 0;
  txt('SESSİZ ODA', 320 + gx - 3, 92, { size: 104, align: 'center', color: 'rgba(200,16,46,.8)' });
  txt('SESSİZ ODA', 320 + gx + 3, 90, { size: 104, align: 'center', color: 'rgba(60,90,200,.5)' });
  txt('SESSİZ ODA', 320 + gx, 91, { size: 104, align: 'center', color: '#efe9de' });
  txt('bir korku oyunu', 320, 196, { size: 30, align: 'center', color: '#8a8590' });
  drawHeart(320, 270, 4, '#ff1f3d');
  if (Math.floor(G.t * 1.6) % 2 === 0) txt(cfg.mode === 'mobile' ? 'BAŞLAMAK İÇİN DOKUN' : 'BAŞLAMAK İÇİN Z VEYA ENTER', 320, 310, { size: 32, align: 'center' });
  const seen = store.get('endings', {}), n = Object.keys(seen).length;
  txt(`SONLAR: ${n} / 3`, 320, 360, { size: 26, align: 'center', color: '#8a8590' });
  if (store.get('haunt', false) && Math.floor(G.t / 5) % 3 === 2) txt(`O SENİ HATIRLIYOR, ${G.name}.`, 320, 400, { size: 30, align: 'center', color: '#c8102e', shake: true });
  else txt('Sağ üstteki ⚙ simgesinden kontrol modunu seç', 320, 410, { size: 22, align: 'center', color: '#55515c' });
}
function askName() {
  initAudio(); const inp = $('nameInput'); inp.value = G.name; $('nameui').hidden = false; G.paused = true; setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 30);
}
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  let v = ($('nameInput').value || '').trim().toLocaleUpperCase('tr-TR').slice(0, 8) || 'MİSAFİR';
  G.name = v; store.set('name', v); $('nameui').hidden = true; G.paused = false; resetHeld(); document.activeElement && document.activeElement.blur();
  startIntro();
});

function update(dt, acts) {
  switch (G.scene) {
    case 'title': if (acts.includes('ok')) { sfx.ok(); askName(); } break;
    case 'intro': updDlg(dt, acts); break;
    case 'over': updOver(dt, acts); break;
    case 'battle': updBattle(dt, acts); break;
    case 'ending':
      if (END.phase === 'text') updDlg(dt, acts);
      else { END.t += dt; if (END.t > 3 && acts.includes('ok')) { sfx.ok(); toTitle(); } }
      break;
  }
}
function draw() {
  preFx();
  switch (G.scene) {
    case 'title': drawTitle(); break;
    case 'intro': ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); drawDlg(); break;
    case 'over': drawOver(); break;
    case 'battle': drawBattle(); break;
    case 'ending':
      drawEndingBG();
      if (END.phase === 'text') drawDlg();
      else {
        const e = ENDINGS[END.type], a = Math.min(1, END.t / 1.5);
        ctx.fillStyle = `rgba(0,0,0,${0.55 * a})`; ctx.fillRect(0, 150, W, 170);
        txt(e.title, 320, 168, { size: 40, align: 'center', color: '#c9c3b8' });
        txt(e.sub, 320, 210, { size: 80, align: 'center', color: END.type === 'bad' ? '#ff3050' : '#fff', shake: END.type === 'bad' });
        if (END.t > 3 && Math.floor(G.t * 2) % 2 === 0) txt(cfg.mode === 'mobile' ? 'ANA MENÜ İÇİN DOKUN' : 'ANA MENÜ İÇİN Z', 320, 290, { size: 26, align: 'center', color: '#9a95a0' });
      }
      break;
  }
  postFx();
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const acts = pq; pq = [];
  if (!G.paused) { G.t += dt; updFx(dt); update(dt, acts); }
  draw(); requestAnimationFrame(frame);
}
resize(); applyMode(); syncSoundBtn(); toTitle();
(document.fonts && document.fonts.load ? document.fonts.load('32px VT323').catch(() => {}) : Promise.resolve()).then(() => requestAnimationFrame(t => { lastT = t; frame(t); }));
</script>
